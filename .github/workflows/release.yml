name: Release merged PR
on:
  pull_request:
    types: [closed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: stable-release
  cancel-in-progress: false
jobs:
  plan:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      commit: ${{ steps.plan.outputs.commit }}
      pr: ${{ steps.plan.outputs.pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release approval and VERSION
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate --slurp "repos/$GH_REPO/pulls/$PR_NUMBER/files" > "$RUNNER_TEMP/files.json"
          python3 scripts/release/plan.py "$GITHUB_EVENT_PATH" "$RUNNER_TEMP/files.json" "$GH_REPO" "$RUNNER_TEMP/plan.json" >> "$GITHUB_OUTPUT"
  checks:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Go, OpenTUI and release regression checks
        run: |
          go test -race ./...
          mkdir -p .build
          go build -o .build/local-vpn-kde.bin ./cmd/local-vpn-kde
          (cd scripts/vpnkit/tui && bun install --frozen-lockfile && bun run check && bun test)
          python3 test/release-workflow-test.py
          python3 test/native-debian-hooks-test.py
          bash test/release-package-test.sh
  native:
    needs: [plan, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        distro: [arch, debian]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - name: Build and validate native package
        env:
          DISTRO: ${{ matrix.distro }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: bash scripts/release/native-packages.sh "$DISTRO" "$VERSION" "$RUNNER_TEMP/native-assets"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.distro }}
          path: ${{ runner.temp }}/native-assets/
          retention-days: 7
          if-no-files-found: error
  docker:
    needs: [plan, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Package merged revision without creating a tag
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
        run: bash scripts/release/package.sh "$RELEASE_TAG" "$RUNNER_TEMP/docker-assets" "$RELEASE_COMMIT"
      - uses: actions/upload-artifact@v4
        with:
          name: release-docker
          path: ${{ runner.temp }}/docker-assets/
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: [plan, native, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: ${{ runner.temp }}/artifacts
      - name: Verify all packages belong to the approved revision
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
        run: python3 scripts/release/assemble.py "$RUNNER_TEMP/artifacts" "$RUNNER_TEMP/release-assets" "$VERSION" "$RELEASE_COMMIT"
      - name: Create immutable tag, upload and verify release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          PR_NUMBER: ${{ needs.plan.outputs.pr }}
        run: python3 scripts/release/publish.py "$RUNNER_TEMP/release-assets" "$VERSION" "$RELEASE_COMMIT" "$PR_NUMBER"
