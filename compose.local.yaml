# Local same-host CachyOS/KDE override for vpnkit.
# Use with a distinct project name; never reuse production vpnkit resources.
services:
  vpnkit:
    # This override is deliberately safe even when no local environment file is
    # loaded: local OpenVPN is never published beyond loopback.
    ports: !override
      - "127.0.0.1:${VPNKIT_LOCAL_OPENVPN_PORT:-${VPNKIT_OPENVPN_PORT:-21194}}:1194/udp"
    environment:
      VPNKIT_ROUTING_MODE: "tun"
      OVPN_CIDR: "${VPNKIT_LOCAL_OVPN_CIDR:-10.89.0.0/24}"
      VPNKIT_IPV6_POLICY: "${VPNKIT_LOCAL_IPV6_POLICY:-block}"
      VPNKIT_COMPAT_BYPASS_ENABLED: "false"
      VPNKIT_BOOTSTRAP_PICK_ON_START: "${VPNKIT_BOOTSTRAP_PICK_ON_START:-false}"
      VPNKIT_BOOTSTRAP_MAX_NODES: "${VPNKIT_BOOTSTRAP_MAX_NODES:-50}"
    labels:
      com.vpnkit.local.owner: "${VPNKIT_LOCAL_RESOURCE_OWNER:-local-lifecycle}"
    volumes:
      - ${VPNKIT_LOCAL_SECRETS_DIR:-./secrets/vpnkit-local}/rendered/openvpn:/etc/openvpn:ro
      - ${VPNKIT_LOCAL_SECRETS_DIR:-./secrets/vpnkit-local}/rendered/sing-box:/etc/sing-box:ro
      - ${VPNKIT_LOCAL_SECRETS_DIR:-./secrets/vpnkit-local}/rendered/vibe-vpn:/etc/vibe-vpn:ro
      - ${VPNKIT_LOCAL_SECRETS_DIR:-./secrets/vpnkit-local}/vibe-vpn:/etc/vibe-vpn-input:ro
      - vpnkit-local-vibe-vpn-state:/var/lib/vibe-vpn
      - vpnkit-local-sing-box-state:/var/lib/vpnkit/sing-box
      - vpnkit-local-vpnkit-logs:/var/log/vpnkit
      - vpnkit-local-vibe-vpn-logs:/var/log/vibe-vpn
    networks:
      vpnkit-local:
        ipv4_address: "${VPNKIT_LOCAL_CONTAINER_ADDRESS:-172.30.89.2}"


volumes:
  vpnkit-local-vibe-vpn-state:
    labels:
      com.vpnkit.local.owner: "${VPNKIT_LOCAL_RESOURCE_OWNER:-local-lifecycle}"
  vpnkit-local-sing-box-state:
    labels:
      com.vpnkit.local.owner: "${VPNKIT_LOCAL_RESOURCE_OWNER:-local-lifecycle}"
  vpnkit-local-vpnkit-logs:
    labels:
      com.vpnkit.local.owner: "${VPNKIT_LOCAL_RESOURCE_OWNER:-local-lifecycle}"
  vpnkit-local-vibe-vpn-logs:
    labels:
      com.vpnkit.local.owner: "${VPNKIT_LOCAL_RESOURCE_OWNER:-local-lifecycle}"

networks:
  vpnkit-local:
    labels:
      com.vpnkit.local.owner: "${VPNKIT_LOCAL_RESOURCE_OWNER:-local-lifecycle}"
    ipam:
      config:
        - subnet: "${VPNKIT_LOCAL_DOCKER_SUBNET:-172.30.89.0/24}"
